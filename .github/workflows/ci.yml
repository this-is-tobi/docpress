name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - "**"
  workflow_dispatch:

permissions: {}

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    outputs:
      BUN_VERSION: ${{ steps.versions.outputs.BUN_VERSION }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Exposing versions pinned in mise.toml
      id: versions
      run: echo "BUN_VERSION=$(sed -n 's/^bun = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

  # Docs-only changes skip everything but lint, which also checks markdown.
  # Release PRs count as docs-only too: they only touch the changelog, the
  # manifest and the version in package.json. Outside a pull request every job runs.
  path-filter:
    uses: this-is-tobi/github-workflows/.github/workflows/classify-changes.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: read
    with:
      PROSE_PATTERNS: >-
        ["docs/*", "*.md", "LICENSE", "NOTICE", ".release-please-manifest.json"
        ${{ startsWith(github.head_ref, 'release-please--') && ', "package.json"' || '' }}]

  # Pull requests are rebase-merged, so every commit lands on main as is and
  # release-please builds the version and changelog from it.
  lint-commits:
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    permissions:
      contents: read
    with:
      CONFIG_FILE: .commitlintrc.json

  scan-secrets:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      GITHUB_SECURITY_TAB: true
      PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || '') }}

  lint:
    uses: this-is-tobi/github-workflows/.github/workflows/lint-js.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    needs:
    - expose-vars
    permissions:
      contents: read
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun

  tests-unit:
    uses: this-is-tobi/github-workflows/.github/workflows/test-vitest.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ needs.path-filter.outputs.code == 'true' }}
    needs:
    - expose-vars
    - path-filter
    permissions:
      contents: read
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun
      COVERAGE: true
      COVERAGE_REPORTER: lcov
      TEST_PRECOMMAND: bun run typecheck
      TEST_COMMAND: bun run test:cov

  tests-cli:
    uses: ./.github/workflows/tests-cli.yml
    if: ${{ needs.path-filter.outputs.code == 'true' }}
    needs:
    - path-filter
    permissions:
      contents: read
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  build-docker:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ needs.path-filter.outputs.code == 'true' }}
    needs:
    - path-filter
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docpress
      IMAGE_TAG: pr-${{ github.event.pull_request.number || github.event.number }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      IMAGE_TARGET: prod
      CACHE: true

  tests-docker:
    uses: ./.github/workflows/tests-docker.yml
    needs:
    - build-docker
    permissions:
      contents: read
    with:
      DOCKER_IMAGE: ${{ (github.event.pull_request.number || github.event.number) && format('ghcr.io/{0}/docpress:pr-{1}', github.repository_owner, (github.event.pull_request.number || github.event.number)) || '' }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  scan-vuln:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ github.base_ref == 'main' || github.base_ref == 'develop' }}
    needs:
    - build-docker
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      IMAGE: ghcr.io/${{ github.repository_owner }}/docpress:pr-${{ github.event.pull_request.number || github.event.number }}
      PATH: .
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || github.event.number) }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Sonarqube scan - requires vars.SONAR_URL repository variable and SONAR_TOKEN + SONAR_PROJECT_KEY secrets
  code-scan:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-sonarqube.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ vars.SONAR_URL != '' }}
    needs:
    - tests-unit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      SONAR_URL: ${{ vars.SONAR_URL }}
      COVERAGE_IMPORT: true
      SOURCES_PATH: src
      FAIL_ON_ERROR: false
      SONAR_EXTRA_ARGS: >
        -Dsonar.javascript.node.maxspace=4096
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        -Dsonar.coverage.exclusions=**/*.spec.js,**/*.spec.ts
        -Dsonar.cpd.exclusions=**/*.spec.js,**/*.spec.ts
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  # The single check the ruleset requires, standing for the path-filtered jobs
  # above: list every job so a failure never reaches it as a skip.
  all-jobs-passed:
    name: Check jobs status
    uses: this-is-tobi/github-workflows/.github/workflows/check-jobs.yml@5369bbcdfcb8d7f260beb463a828421cfe1d8db2 # v0.36.0
    if: ${{ always() }}
    needs:
    - expose-vars
    - path-filter
    - lint-commits
    - scan-secrets
    - lint
    - tests-unit
    - tests-cli
    - build-docker
    - tests-docker
    - scan-vuln
    - code-scan
    with:
      NEEDS: ${{ toJson(needs) }}
