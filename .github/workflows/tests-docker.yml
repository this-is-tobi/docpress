name: Tests - docker

on:
  workflow_call:
    inputs:
      DOCKER_IMAGE:
        required: false
        type: string
    secrets:
      APP_CLIENT_ID:
        description: GitHub App Client ID, used to mint a read-only token for the GitHub API calls docpress makes
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false
  workflow_dispatch:
    inputs:
      DOCKER_IMAGE:
        description: Docker image used for tests
        required: false
        type: string

permissions: {}

jobs:
  docker-tests:
    name: Docker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Mint GitHub App token
      # Read-only, and only for the 5,000 requests/hour an App gets against the
      # job token's 1,000. Without the App secrets (e.g. fork pull requests) the
      # tests fall back to GITHUB_TOKEN.
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: read
        permission-metadata: read

    - name: Install bun
      # As pinned in mise.toml, rather than whatever bun is latest
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        install_args: bun

    - name: Run docker tests
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        DOCKER_IMAGE: ${{ inputs.DOCKER_IMAGE }}
      run: ./ci/scripts/run-tests.sh -d "$DOCKER_IMAGE"
