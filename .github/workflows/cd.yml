name: CD

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions: {}

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The toolchain that builds and publishes to npm is the one pinned in mise.toml
      BUN_VERSION: ${{ steps.versions.outputs.BUN_VERSION }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Exposing versions pinned in mise.toml
      id: versions
      run: echo "BUN_VERSION=$(sed -n 's/^bun = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@73f7d8c7954181d30c8459d9799d8772f8191703 # v0.35.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      TAG_MAJOR_AND_MINOR: true
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  npm:
    uses: this-is-tobi/github-workflows/.github/workflows/release-npm.yml@73f7d8c7954181d30c8459d9799d8772f8191703 # v0.35.0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      contents: read
      id-token: write
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun
      BUILD_COMMAND: bun run build
      # Trusted publishing already attaches it, this fails the release if it ever stops
      PROVENANCE: true
    # No NPM_TOKEN: publishing relies on the npmjs.com trusted publisher (OIDC)
    # registered for this repository and workflow file, via id-token: write

  docker:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@73f7d8c7954181d30c8459d9799d8772f8191703 # v0.35.0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - release
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docpress
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      IMAGE_TARGET: prod
      TAG_MAJOR_AND_MINOR: true
      LATEST_TAG: true

  # SLSA provenance (GitHub attestation), SPDX SBOM and keyless cosign signature
  # for the released image, verifiable with `gh attestation verify` and `cosign`.
  attest:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@73f7d8c7954181d30c8459d9799d8772f8191703 # v0.35.0
    needs:
    - docker
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
      PROVENANCE: true
      SBOM: true
      SIGN: true
